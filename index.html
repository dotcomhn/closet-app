<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="季節ごとに手持ちの服をランダムに組み合わせてスワイプで仕分けするクローゼット・コーデアプリ">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>コーデ発掘</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">

    <!-- ===== Header ===== -->
    <header id="app-header">
      <h1 id="header-title">コーデ発掘</h1>
    </header>

    <!-- ===== Tab: クローゼット ===== -->
    <main id="tab-closet" class="tab-content active">

      <!-- Season selector -->
      <div class="season-bar" id="season-bar-closet">
        <button class="season-chip active" data-season="spring">🌸 春</button>
        <button class="season-chip" data-season="summer">🌻 夏</button>
        <button class="season-chip" data-season="autumn">🍂 秋</button>
        <button class="season-chip" data-season="winter">❄️ 冬</button>
      </div>

      <!-- Tops section -->
      <div class="closet-section">
        <div class="section-header">
          <h2>トップス</h2>
          <span id="tops-count" class="badge">0</span>
        </div>
        <div class="upload-area">
          <label for="input-tops" class="upload-label" id="label-tops">
            <div class="upload-icon">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 5v14M5 12h14"/>
              </svg>
            </div>
            <span>タップして写真を追加</span>
          </label>
          <input type="file" id="input-tops" accept="image/*" multiple hidden>
        </div>
        <div id="gallery-tops" class="item-gallery"></div>
      </div>

      <!-- Bottoms section -->
      <div class="closet-section">
        <div class="section-header">
          <h2>ボトムス</h2>
          <span id="bottoms-count" class="badge">0</span>
        </div>
        <div class="upload-area">
          <label for="input-bottoms" class="upload-label" id="label-bottoms">
            <div class="upload-icon">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 5v14M5 12h14"/>
              </svg>
            </div>
            <span>タップして写真を追加</span>
          </label>
          <input type="file" id="input-bottoms" accept="image/*" multiple hidden>
        </div>
        <div id="gallery-bottoms" class="item-gallery"></div>
      </div>
    </main>

    <!-- ===== Tab: スワイプ ===== -->
    <main id="tab-swipe" class="tab-content">

      <!-- Season selector -->
      <div class="season-bar" id="season-bar-swipe">
        <button class="season-chip active" data-season="spring">🌸 春</button>
        <button class="season-chip" data-season="summer">🌻 夏</button>
        <button class="season-chip" data-season="autumn">🍂 秋</button>
        <button class="season-chip" data-season="winter">❄️ 冬</button>
      </div>

      <div id="swipe-empty" class="empty-state">
        <div class="empty-icon">
          <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="3"/>
            <path d="M12 8v8M8 12h8"/>
          </svg>
        </div>
        <p id="swipe-empty-msg">この季節のトップスとボトムスを<br>それぞれ1枚以上追加してね</p>
      </div>

      <div id="swipe-area" class="swipe-area hidden">
        <!-- Overlay indicators -->
        <div id="overlay-nope" class="swipe-overlay overlay-nope">
          <span>NOPE</span>
        </div>
        <div id="overlay-like" class="swipe-overlay overlay-like">
          <span>LIKE!</span>
        </div>

        <div id="swipe-card" class="swipe-card">
          <div class="card-combo">
            <div class="card-img-wrapper top-img-wrapper">
              <img id="swipe-top-img" src="" alt="トップス">
              <span class="card-label">トップス</span>
            </div>
            <div class="card-divider">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 5v14M5 12h14"/>
              </svg>
            </div>
            <div class="card-img-wrapper bottom-img-wrapper">
              <img id="swipe-bottom-img" src="" alt="ボトムス">
              <span class="card-label">ボトムス</span>
            </div>
          </div>
        </div>

        <div class="swipe-actions">
          <button id="btn-nope" class="action-btn nope-btn" aria-label="なし">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
              <path d="M18 6L6 18M6 6l12 12"/>
            </svg>
          </button>
          <button id="btn-like" class="action-btn like-btn" aria-label="あり！">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
              <path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/>
            </svg>
          </button>
        </div>

        <p id="combo-counter" class="combo-counter"></p>
        <p id="fav-counter" class="fav-counter">♥ お気に入り: 0件</p>
      </div>
    </main>

    <!-- ===== Tab: お気に入り ===== -->
    <main id="tab-favs" class="tab-content">

      <!-- Season selector -->
      <div class="season-bar" id="season-bar-favs">
        <button class="season-chip active" data-season="spring">🌸 春</button>
        <button class="season-chip" data-season="summer">🌻 夏</button>
        <button class="season-chip" data-season="autumn">🍂 秋</button>
        <button class="season-chip" data-season="winter">❄️ 冬</button>
      </div>

      <!-- Status filter -->
      <div class="filter-bar" id="filter-bar-favs">
        <button class="filter-chip active" data-filter="all">すべて</button>
        <button class="filter-chip" data-filter="untried">未挑戦</button>
        <button class="filter-chip" data-filter="tried">挑戦済み ✓</button>
      </div>

      <div id="favs-empty" class="empty-state">
        <div class="empty-icon">
          <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/>
          </svg>
        </div>
        <p>この季節のお気に入りコーデはまだないよ<br>スワイプして見つけよう！</p>
      </div>
      <div id="favs-list" class="favs-list"></div>
    </main>

    <!-- ===== Bottom Tab Bar ===== -->
    <nav id="tab-bar">
      <button class="tab-btn active" data-tab="closet" id="tab-btn-closet">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>クローゼット</span>
      </button>
      <button class="tab-btn" data-tab="swipe" id="tab-btn-swipe">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="3"/>
          <path d="M8 12h8M12 8v8"/>
        </svg>
        <span>スワイプ</span>
      </button>
      <button class="tab-btn" data-tab="favs" id="tab-btn-favs">
        <div class="tab-icon-wrapper">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/>
          </svg>
          <span id="fav-tab-badge" class="tab-badge hidden">0</span>
        </div>
        <span>お気に入り</span>
      </button>
    </nav>
  </div>

  <!-- Delete confirmation modal -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal-box">
      <p id="modal-message">この画像を削除しますか？</p>
      <div class="modal-actions">
        <button id="modal-cancel" class="modal-btn cancel">キャンセル</button>
        <button id="modal-confirm" class="modal-btn confirm">削除</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
